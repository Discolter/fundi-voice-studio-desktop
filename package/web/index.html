<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="Fundi Voice — личное рабочее пространство студии озвучки. Проекты, серии, роли, задачи и материалы в одном месте.">
  <title>Fundi Voice · Студия</title>
  <link rel="icon" type="image/png" href="brand-mark.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="animated-themes.css">
  <link rel="stylesheet" href="compact.css">
  <link rel="stylesheet" href="file-tools.css">
  <link rel="stylesheet" href="file-browser.css">
  <link rel="stylesheet" href="visual-selects.css">
  <link rel="stylesheet" href="task-priorities.css">
  <link rel="stylesheet" href="update-notice.css">
  <link rel="stylesheet" href="site-manager.css">
  <link rel="stylesheet" href="role-image-viewer.css">
</head>
<body>
  <div id="app"><div class="boot"><span class="brand-mark"><img src="brand-mark.png" alt=""></span><p>Открываем студию…</p></div></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="file-transfer-slot"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <script>
    // A failed ES module import otherwise leaves the initial splash visible forever.
    setTimeout(function(){
      var loading=document.querySelector('#app > .boot');
      if(!loading)return;
      var error=document.createElement('p');
      error.className='small muted';
      error.textContent='Не удалось запустить интерфейс. Проверь обновление Studio и перезапусти приложение.';
      loading.appendChild(error);
    },10000);
  </script>
  <script defer src="role-image-viewer.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
